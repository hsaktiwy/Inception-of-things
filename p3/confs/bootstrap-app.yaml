apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hsaktiwy-iot-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hsaktiwy/Inception-of-things-part3-support
    targetRevision: HEAD
    path: confs
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy: # <--- ADD THIS BLOCK
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # Optional: Tells ArgoCD to create the dev namespace if it doesn't exist