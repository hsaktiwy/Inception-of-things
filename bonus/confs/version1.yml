global:
  edition: ce
  ingress:
    enabled: false
    tls:
      enabled: false
    configureCertmanager: false
  kas:
    enabled: false
  gatewayApi:
    enabled: false
    installEnvoy: false
  psql:
    host: gitlab-postgresql
    database: gitlabhq_production
    username: gitlab
    password:
      secret: gitlab-postgresql
      key: password
  redis:
    host: gitlab-redis-master
    password:
      enabled: false
    livenessProbe:
      initialDelaySeconds: 120
    readinessProbe:
      initialDelaySeconds: 120
  appConfig:
    lfs:
      enabled: false
    artifacts:
      enabled: false
    uploads:
      enabled: false
    packages:
      enabled: false

nginx-ingress:
  enabled: false

ai-gateway:
  enabled: false

gitlab-pages:
  enabled: false

spamcheck:
  enabled: false

mailroom:
  enabled: false

installCertmanager: false

certmanager-issuer:
  email: test@example.com

grafana:
  enabled: false

registry:
  enabled:
