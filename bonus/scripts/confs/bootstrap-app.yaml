apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hsaktiwy-iot-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/root/hsaktiwy-ception.git
    targetRevision: HEAD
    path: confs
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy: # <--- ADD THIS BLOCK
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # Optional: Tells ArgoCD to create the dev namespace if it doesn't exist
